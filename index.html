<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplikasi Absensi Digital Terhubung Google Sheets">
    
    <!-- TAG ANTI-CACHE SUPER KUAT -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Cache-Control" content="post-check=0, pre-check=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Aplikasi Absensi Terpadu v2.1</title>
    
    <!-- Pustaka Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const APP_VERSION = "2.1"; // Indikator versi untuk memastikan update berhasil

        // --- 1. FUNGSI UTILITAS ---
        // Penanganan Local Storage 
        const getStorage = (key, defaultVal) => {
            try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : defaultVal; } 
            catch(e) { return defaultVal; }
        };
        const setStorage = (key, val) => {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
        };

        // Menghitung Jarak GPS (Meter)
        function hitungJarakMeter(lat1, lon1, lat2, lon2) {
          const R = 6371000; 
          const dLat = (lat2 - lat1) * Math.PI / 180;
          const dLon = (lon2 - lon1) * Math.PI / 180;
          const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + 
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
          return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)))); 
        }

        // Export Data ke CSV
        function exportKeCSV(data, namaFile) {
            if (!data || data.length === 0) return alert("Tidak ada data untuk diekspor!");
            const dataBersih = data.map(({ id, dbId, foto, timestamp, ...sisa }) => sisa); 
            const header = Object.keys(dataBersih[0]).join(',');
            const baris = dataBersih.map(obj => Object.values(obj).map(val => `"${val}"`).join(',')).join('\n');
            const blob = new Blob([header + '\n' + baris], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob); link.download = namaFile; link.click();
        }

        // Komponen Toast (Notifikasi)
        const ToastUI = ({ pesan }) => {
            if (!pesan) return null;
            return (
                <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center text-sm font-medium animate-bounce border border-slate-700">
                    <i className="fas fa-info-circle mr-2 text-blue-400"></i> {pesan}
                </div>
            );
        };

        // --- 2. KOMPONEN UTAMA (Aplikasi Root) ---
        function AplikasiAbsensi() {
          const [penggunaAktif, setPenggunaAktif] = useState(null); 
          const [notifikasi, setNotifikasi] = useState('');
          
          // SETTING URL API DINAMIS (Disimpan di LocalStorage)
          const [scriptUrl, setScriptUrl] = useState(() => getStorage('absen_api_url', ''));
          const isApiConfigured = scriptUrl && scriptUrl.startsWith("https://script.google.com/");

          const [statusCloud, setStatusCloud] = useState(isApiConfigured ? 'Menghubungkan...' : 'Mode Lokal (Offline)');
          const [isSinkronisasi, setIsSinkronisasi] = useState(false);

          // State Data (Local Storage sebagai Fallback/Cache)
          const [akunStorage, setAkunStorage] = useState(() => getStorage('absen_akun', [{ id: 'admin_1', username: 'admin', password: 'Karsa43', name: 'Administrator', role: 'admin' }]));
          const [logs, setLogs] = useState(() => getStorage('absen_logs', []));
          const [pengajuan, setPengajuan] = useState(() => getStorage('absen_reqs', []));
          const [laporan, setLaporan] = useState(() => getStorage('absen_reps', []));
          const [lokasiKantor, setLokasiKantor] = useState(() => getStorage('absen_loc', { lat: -6.200000, lng: 106.816666 }));
          const BATAS_JARAK_METER = 100;

          // Auto-Save Backup ke Local Storage
          useEffect(() => setStorage('absen_api_url', scriptUrl), [scriptUrl]);
          useEffect(() => setStorage('absen_akun', akunStorage), [akunStorage]);
          useEffect(() => setStorage('absen_logs', logs), [logs]);
          useEffect(() => setStorage('absen_reqs', pengajuan), [pengajuan]);
          useEffect(() => setStorage('absen_reps', laporan), [laporan]);
          useEffect(() => setStorage('absen_loc', lokasiKantor), [lokasiKantor]);

          const tampilkanToast = (pesan) => { setNotifikasi(pesan); setTimeout(() => setNotifikasi(''), 3000); };

          // Tarik Data dari Google Sheets (GET)
          const sinkronisasiData = useCallback(async (sembunyiStatus = false) => {
              if(!isApiConfigured) {
                  setStatusCloud('Mode Lokal (Offline)');
                  return;
              }
              if(!sembunyiStatus) setStatusCloud('Menyinkronkan data...');
              setIsSinkronisasi(true);
              
              try {
                  const respon = await fetch(scriptUrl + "?action=getAll");
                  if (!respon.ok) throw new Error("Gagal mengambil data dari URL.");
                  const hasil = await respon.json();
                  const urutWaktu = (a, b) => b.timestamp - a.timestamp;
                  
                  if(hasil.users && hasil.users.length > 0) setAkunStorage(hasil.users);
                  if(hasil.logs) setLogs(hasil.logs.sort(urutWaktu));
                  if(hasil.requests) setPengajuan(hasil.requests.sort(urutWaktu));
                  if(hasil.reports) setLaporan(hasil.reports.sort(urutWaktu));
                  if(hasil.settings && hasil.settings.lokasi_kantor) setLokasiKantor(hasil.settings.lokasi_kantor);

                  setStatusCloud('Terhubung ke Sheets');
              } catch (error) {
                  console.error("Fetch Error:", error);
                  setStatusCloud('Gagal Koneksi. Cek Link API!');
              } finally {
                  setIsSinkronisasi(false);
              }
          }, [scriptUrl, isApiConfigured]);

          // Auto-Polling 8 detik
          useEffect(() => {
              sinkronisasiData(false); 
              if(!isApiConfigured) return;
              const interval = setInterval(() => { sinkronisasiData(true); }, 8000); 
              return () => clearInterval(interval);
          }, [sinkronisasiData, isApiConfigured]);

          // POST Data ke Google Sheets
          const postDataKeSheet = async (action, data) => {
             if(!isApiConfigured) return;
             try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: action, data: data })
                });
                sinkronisasiData(true); 
             } catch(e) { 
                 console.error("Gagal POST ke sheets", e); 
                 tampilkanToast("Terjadi kendala jaringan saat menyimpan ke Sheets.");
             }
          };

          const aksi = {
             daftarAkun: async (data) => { 
                const payload = { id: Date.now(), ...data, timestamp: Date.now() };
                setAkunStorage([...akunStorage, payload]); 
                await postDataKeSheet('addUser', payload); 
             },
             absen: async (data) => { 
                const payload = { id: Date.now(), ...data, timestamp: Date.now() };
                setLogs([payload, ...logs]); 
                await postDataKeSheet('addLog', payload); 
                tampilkanToast("Absen berhasil dikirim!"); 
             },
             pengajuan: async (data) => { 
                const payload = { id: Date.now(), ...data, timestamp: Date.now() };
                setPengajuan([payload, ...pengajuan]);
                await postDataKeSheet('addRequest', payload); 
                tampilkanToast("Pengajuan terkirim ke Admin!"); 
             },
             laporan: async (data) => { 
                const payload = { id: Date.now(), ...data, timestamp: Date.now() };
                setLaporan([payload, ...laporan]);
                await postDataKeSheet('addReport', payload); 
                tampilkanToast("Laporan harian tersimpan!"); 
             },
             updateStatus: async (id, status) => { 
                setPengajuan(pengajuan.map(p => p.id == id ? {...p, status} : p));
                await postDataKeSheet('updateRequestStatus', { id, status }); 
                tampilkanToast("Status diperbarui!"); 
             },
             updatePengaturan: async (koordinat, newUrl) => { 
                if (newUrl !== scriptUrl) {
                    setScriptUrl(newUrl);
                    tampilkanToast("URL API Diperbarui! Sistem akan dimuat ulang...");
                    setTimeout(() => window.location.reload(), 1500);
                    return;
                }
                setLokasiKantor(koordinat);
                await postDataKeSheet('updateLokasi', { koordinat }); 
                tampilkanToast("Pusat GPS Kantor Diperbarui!"); 
             },
             resetAbsen: async () => {
                setLogs([]);
                await postDataKeSheet('resetLogs', {});
                tampilkanToast("Semua riwayat absen dibersihkan!");
             }
          };

          // Banner Peringatan
          const ModeBanner = () => !isApiConfigured ? (
             <div className="bg-amber-500 text-white text-center text-[10px] sm:text-xs font-bold py-1.5 px-2 w-full z-50 shadow-md">
                 <i className="fas fa-exclamation-triangle mr-1"></i> Mode Offline. Login sebagai Admin (`admin` / `Karsa43`) untuk mengatur koneksi Google Sheets.
             </div>
          ) : null;

          // RENDER LAYAR LOGIN
          if (!penggunaAktif) {
            return (
              <>
                <ModeBanner />
                <LayarLogin setPenggunaAktif={setPenggunaAktif} dataAkun={akunStorage} aksiDaftar={aksi.daftarAkun} statusCloud={statusCloud} forceRefresh={()=>window.location.reload()} />
              </>
            );
          }

          // RENDER DASHBOARD
          return (
            <div className="min-h-screen bg-slate-100 pb-20 md:pb-0">
              <ModeBanner />
              <ToastUI pesan={notifikasi} />
              {penggunaAktif.role === 'admin' ? (
                <DashboardAdmin 
                  onLogout={() => setPenggunaAktif(null)} 
                  data={{ logs, pengajuan, laporan }} 
                  lokasiKantor={lokasiKantor}
                  scriptUrl={scriptUrl}
                  aksi={aksi} exportCSV={exportKeCSV}
                  isSinkron={isSinkronisasi}
                  forceRefresh={()=>sinkronisasiData(false)}
                />
              ) : (
                <DashboardKaryawan 
                  user={penggunaAktif} onLogout={() => setPenggunaAktif(null)} 
                  lokasiKantor={lokasiKantor} batasJarak={BATAS_JARAK_METER}
                  aksi={aksi} showToast={tampilkanToast}
                  isSinkron={isSinkronisasi}
                />
              )}
            </div>
          );
        }

        // --- 3. KOMPONEN: LAYAR LOGIN & REGISTER ---
        function LayarLogin({ setPenggunaAktif, dataAkun, aksiDaftar, statusCloud, forceRefresh }) {
          const [modeRegister, setModeRegister] = useState(false);
          const [form, setForm] = useState({ nama: '', departemen: '', username: '', password: '' });
          const [pesanError, setPesanError] = useState('');
          const [pesanSukses, setPesanSukses] = useState('');

          const handleInput = (e) => setForm({ ...form, [e.target.name]: e.target.value });

          const submitForm = async (e) => {
            e.preventDefault();
            setPesanError(''); setPesanSukses('');

            if (!modeRegister && form.username === 'admin' && form.password === 'Karsa43') {
                return setPenggunaAktif({ id: 'admin_1', username: 'admin', name: 'Administrator', role: 'admin' });
            }

            if (modeRegister) {
                if (form.username.toLowerCase() === 'admin') return setPesanError('Username tidak valid!');
                const userExists = dataAkun && dataAkun.some(u => String(u.username).trim() === form.username.trim());
                if (userExists) return setPesanError('Username sudah digunakan!');
                
                await aksiDaftar({ name: form.nama, department: form.departemen, username: form.username, password: form.password, role: 'karyawan', createdAt: new Date().toLocaleDateString('id-ID') });
                setPesanSukses('Akun berhasil dibuat! Silakan masuk.');
                setModeRegister(false); setForm({ ...form, password: '' });
            } else {
                const userKetemu = dataAkun && dataAkun.find(u => String(u.username).trim() === form.username.trim() && String(u.password) === form.password);
                if (userKetemu) setPenggunaAktif(userKetemu);
                else setPesanError('Username atau Password salah/belum terdaftar!');
            }
          };

          return (
            <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
              <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden mb-4 border border-slate-100">
                <div className="bg-gradient-to-br from-emerald-600 to-emerald-800 p-8 text-center relative overflow-hidden">
                  <div className="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-white opacity-10 rounded-full blur-xl"></div>
                  <i className={`fas ${modeRegister ? 'fa-user-plus' : 'fa-fingerprint'} text-5xl text-white/90 mb-4 drop-shadow-lg relative z-10`}></i>
                  <h1 className="text-2xl font-black text-white tracking-tight relative z-10">
                    {modeRegister ? 'Buat Akun Baru' : 'Portal Karyawan'}
                  </h1>
                  <p className="text-emerald-100 mt-1 text-sm font-medium relative z-10">
                    Sistem Absensi Digital <span className="bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded-full ml-1">v{APP_VERSION}</span>
                  </p>
                </div>
                
                <div className="p-8">
                  {pesanError && <div className="mb-4 bg-rose-50 text-rose-600 p-3 rounded-xl text-sm font-semibold border border-rose-100 flex items-center"><i className="fas fa-exclamation-triangle mr-2"></i>{pesanError}</div>}
                  {pesanSukses && <div className="mb-4 bg-emerald-50 text-emerald-600 p-3 rounded-xl text-sm font-semibold border border-emerald-100 flex items-center"><i className="fas fa-check mr-2"></i>{pesanSukses}</div>}

                  <form onSubmit={submitForm} className="space-y-4">
                    {modeRegister && (
                      <>
                        <input type="text" name="nama" required placeholder="Nama Lengkap" value={form.nama} onChange={handleInput} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 outline-none focus:border-emerald-500 font-medium text-slate-700 transition-all" />
                        <input type="text" name="departemen" required placeholder="Divisi / Departemen" value={form.departemen} onChange={handleInput} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 outline-none focus:border-emerald-500 font-medium text-slate-700 transition-all" />
                      </>
                    )}
                    <input type="text" name="username" required placeholder="Username" value={form.username} onChange={handleInput} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 outline-none focus:border-emerald-500 font-medium text-slate-700 transition-all" />
                    <input type="password" name="password" required placeholder="Password" value={form.password} onChange={handleInput} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 outline-none focus:border-emerald-500 font-medium text-slate-700 transition-all" />
                    
                    <button type="submit" className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black tracking-wide rounded-xl mt-4 shadow-lg shadow-emerald-600/30 transition-all active:scale-95 flex items-center justify-center">
                      {modeRegister ? 'DAFTAR SEKARANG' : 'MASUK KE SISTEM'}
                    </button>
                  </form>
                  
                  <div className="mt-6 text-center flex flex-col space-y-3">
                    <button onClick={() => { setModeRegister(!modeRegister); setPesanError(''); setPesanSukses(''); }} className="text-sm font-bold text-slate-500 hover:text-emerald-600 transition-colors">
                      {modeRegister ? 'Sudah punya akun? Masuk' : 'Karyawan Baru? Buat Akun'}
                    </button>
                  </div>
                </div>
              </div>
              <div className={`px-5 py-2.5 rounded-full text-xs font-bold flex items-center shadow-sm cursor-pointer ${statusCloud.includes('Terhubung') ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-slate-200 text-slate-600 border border-slate-300'}`} onClick={forceRefresh}>
                 <i className={`fas ${statusCloud.includes('Terhubung') ? 'fa-check-circle' : statusCloud.includes('Gagal') ? 'fa-times-circle text-rose-500' : 'fa-sync-alt'} mr-2`}></i> {statusCloud}
              </div>
            </div>
          );
        }

        // --- 4. KOMPONEN: DASHBOARD KARYAWAN ---
        function DashboardKaryawan({ user, onLogout, lokasiKantor, batasJarak, aksi, showToast, isSinkron }) {
          const [tab, setTab] = useState('absen');

          return (
            <div className="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col">
              <div className="bg-gradient-to-r from-emerald-700 to-emerald-600 text-white p-6 rounded-b-[2.5rem] shadow-xl z-10 relative overflow-hidden">
                <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full blur-2xl -mr-10 -mt-10"></div>
                <div className="flex justify-between items-center mb-6 relative z-10">
                  <div>
                    <h2 className="text-xl font-black">{user.name || user.nama}</h2>
                    <p className="text-emerald-200 text-sm font-medium">{user.department || user.departemen}</p>
                  </div>
                  <button onClick={onLogout} className="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center hover:bg-white/20 transition-colors"><i className="fas fa-power-off"></i></button>
                </div>
                <div className="bg-white/10 backdrop-blur-sm rounded-2xl p-4 flex items-center justify-between border border-white/20 relative z-10">
                  <div className="flex items-center"><i className="far fa-clock text-2xl mr-3 opacity-80"></i><span className="font-black text-2xl tracking-wider">{new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</span></div>
                  <div className="flex flex-col items-end">
                     <span className="text-xs bg-white text-emerald-800 font-bold px-3 py-1.5 rounded-lg shadow-sm mb-1">{new Date().toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' })}</span>
                     {isSinkron && <span className="text-[9px] text-emerald-100 flex items-center"><i className="fas fa-sync fa-spin mr-1"></i> Sync</span>}
                  </div>
                </div>
              </div>

              <div className="flex-1 p-6 overflow-y-auto z-0 bg-slate-50/50">
                {tab === 'absen' && <FiturAbsensi user={user} lokasiKantor={lokasiKantor} batasJarak={batasJarak} aksiAbsen={aksi.absen} showToast={showToast} />}
                {tab === 'pengajuan' && <FiturFormulir tipe="pengajuan" user={user} onSubmit={aksi.pengajuan} />}
                {tab === 'laporan' && <FiturFormulir tipe="laporan" user={user} onSubmit={aksi.laporan} />}
              </div>

              <div className="fixed md:absolute bottom-0 w-full max-w-md bg-white border-t border-slate-100 flex justify-around p-3 pb-6 shadow-[0_-10px_20px_rgba(0,0,0,0.04)] z-20">
                {[
                  { id: 'absen', ikon: 'fa-camera-retro', label: 'Absen' },
                  { id: 'pengajuan', ikon: 'fa-envelope-open-text', label: 'Izin' },
                  { id: 'laporan', ikon: 'fa-clipboard-list', label: 'Laporan' }
                ].map(nav => (
                  <button key={nav.id} onClick={() => setTab(nav.id)} className={`flex flex-col items-center w-20 transition-all ${tab === nav.id ? '-translate-y-2' : ''}`}>
                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center mb-1 transition-all ${tab === nav.id ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' : 'text-slate-400'}`}>
                      <i className={`fas ${nav.ikon} text-xl`}></i>
                    </div>
                    <span className={`text-[10px] font-bold ${tab === nav.id ? 'text-emerald-600' : 'text-slate-400'}`}>{nav.label}</span>
                  </button>
                ))}
              </div>
            </div>
          );
        }

        function FiturAbsensi({ user, lokasiKantor, batasJarak, aksiAbsen, showToast }) {
          const [statusLokasi, setStatusLokasi] = useState({ jarak: null, pesan: 'Mencari sinyal GPS...' });
          const [kamera, setKamera] = useState({ aktif: false, jenis: '', fotoB64: null });
          const refVideo = useRef(null);

          const perbaruiGPS = () => {
            setStatusLokasi({ jarak: null, pesan: 'Mengkalibrasi koordinat...' });
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                (pos) => {
                  const jarakHitung = hitungJarakMeter(pos.coords.latitude, pos.coords.longitude, lokasiKantor.lat, lokasiKantor.lng);
                  setStatusLokasi({ jarak: jarakHitung, pesan: '' });
                },
                (err) => setStatusLokasi({ jarak: null, pesan: 'Akses ditolak / Error. Periksa Izin Browser.' }),
                { enableHighAccuracy: true, timeout: 10000 }
              );
            } else setStatusLokasi({ jarak: null, pesan: 'Browser tidak mendukung GPS.' });
          };

          useEffect(() => { perbaruiGPS(); }, [lokasiKantor]);

          useEffect(() => {
            let streamObj;
            if (kamera.aktif && !kamera.fotoB64) {
              navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(s => { streamObj = s; if (refVideo.current) refVideo.current.srcObject = s; })
                .catch(() => { showToast("Kamera diblokir browser! Izinkan akses kamera."); setKamera({ ...kamera, aktif: false }); });
            }
            return () => { if (streamObj) streamObj.getTracks().forEach(t => t.stop()); };
          }, [kamera.aktif, kamera.fotoB64]);

          const bukaKamera = (jenisAbsen) => {
            if (statusLokasi.pesan) {
                showToast("Peringatan: Sinyal GPS tidak tersedia! Absen akan ditandai.");
            } else if (statusLokasi.jarak > batasJarak) {
                showToast(`Peringatan: Anda di luar kantor (${statusLokasi.jarak}m). Log ditandai luar jangkauan!`);
            }
            setKamera({ aktif: true, jenis: jenisAbsen, fotoB64: null });
          };

          const jepretFoto = () => {
            if (!refVideo.current) return;
            const cvs = document.createElement('canvas');
            
            // Kompresi ketat untuk Sheets API
            const MAX_WIDTH = 250; 
            const scaleSize = MAX_WIDTH / refVideo.current.videoWidth;
            cvs.width = MAX_WIDTH;
            cvs.height = refVideo.current.videoHeight * scaleSize;
            
            cvs.getContext('2d').drawImage(refVideo.current, 0, 0, cvs.width, cvs.height);
            const base64 = cvs.toDataURL('image/jpeg', 0.4); 
            
            setKamera({ ...kamera, fotoB64: base64 });

            let statusPenilaian = 'Tepat Lokasi';
            if (statusLokasi.pesan) statusPenilaian = 'GPS Tidak Aktif';
            else if (statusLokasi.jarak > batasJarak) statusPenilaian = 'Luar Jangkauan';
            
            aksiAbsen({
               userName: user.name || user.nama, 
               type: kamera.jenis, 
               foto: base64, 
               date: new Date().toLocaleDateString('id-ID'), 
               time: new Date().toLocaleTimeString('id-ID'),
               status: statusPenilaian
            });
            setTimeout(() => setKamera({ aktif: false, jenis: '', fotoB64: null }), 1200);
          };

          if (kamera.aktif) {
             return (
               <div className="fixed inset-0 bg-slate-900 z-50 flex flex-col">
                  <div className="p-4 flex justify-between items-center text-white bg-slate-900 absolute top-0 w-full z-10 shadow-md">
                     <span className="font-bold">Mode: {kamera.jenis}</span>
                     <button onClick={() => setKamera({ ...kamera, aktif: false })} className="w-8 h-8 bg-white/20 rounded-full hover:bg-white/30"><i className="fas fa-times"></i></button>
                  </div>
                  <div className="flex-1 relative flex items-center justify-center bg-black mt-14">
                     {!kamera.fotoB64 ? <video ref={refVideo} autoPlay playsInline className="min-w-full min-h-full object-cover" /> : <img src={kamera.fotoB64} alt="Hasil" className="min-w-full min-h-full object-cover" />}
                     {!kamera.fotoB64 && <div className="absolute inset-0 border-[40px] border-slate-900/80 rounded-full w-[300px] h-[400px] m-auto pointer-events-none"></div>}
                  </div>
                  <div className="h-32 bg-slate-900 flex justify-center items-center pb-6">
                     {!kamera.fotoB64 ? (
                        <button onClick={jepretFoto} className="w-20 h-20 bg-white rounded-full border-4 border-slate-500 flex items-center justify-center active:scale-95 transition-transform"><div className="w-16 h-16 border-2 border-slate-900 rounded-full"></div></button>
                     ) : <div className="text-emerald-400 font-bold flex flex-col items-center animate-pulse"><i className="fas fa-check-circle text-3xl mb-1"></i>Menyimpan...</div>}
                  </div>
               </div>
             );
          }

          const radiusValid = statusLokasi.jarak !== null && statusLokasi.jarak <= batasJarak;

          return (
             <div className="space-y-6">
                <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
                   <div className="flex items-center">
                      <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mr-4 shadow-inner ${statusLokasi.pesan ? 'bg-slate-100 text-slate-400' : radiusValid ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                         <i className="fas fa-map-marked-alt"></i>
                      </div>
                      <div>
                         <h3 className="font-black text-slate-800 text-sm mb-0.5">Sinyal GPS</h3>
                         {statusLokasi.pesan ? <p className="text-xs text-rose-500 font-bold">{statusLokasi.pesan}</p> : 
                         <p className="text-xs text-slate-500 font-medium">Jarak ke kantor: <strong className={radiusValid ? 'text-emerald-600' : 'text-rose-600'}>{statusLokasi.jarak} Meter</strong><br/>
                         <span className="text-[10px] uppercase font-black">{radiusValid ? '✅ Valid Radius' : '❌ Di Luar Jangkauan'}</span></p>}
                      </div>
                   </div>
                   <button onClick={perbaruiGPS} className="p-3 bg-slate-50 rounded-xl text-emerald-500 hover:bg-emerald-100 transition-colors"><i className="fas fa-sync-alt"></i></button>
                </div>

                <div className="grid grid-cols-2 gap-4">
                   {[
                      { j: 'Absen Masuk', i: 'fa-sign-in-alt', c: 'bg-emerald-500 shadow-emerald-200' },
                      { j: 'Mulai Istirahat', i: 'fa-utensils', c: 'bg-amber-500 shadow-amber-200' },
                      { j: 'Selesai Istirahat', i: 'fa-briefcase', c: 'bg-blue-500 shadow-blue-200' },
                      { j: 'Absen Pulang', i: 'fa-sign-out-alt', c: 'bg-rose-500 shadow-rose-200' }
                   ].map(btn => (
                      <button key={btn.j} onClick={() => bukaKamera(btn.j)} className={`${btn.c} text-white p-5 rounded-3xl shadow-lg flex flex-col items-center justify-center transition-transform active:scale-95 group`}>
                         <i className={`fas ${btn.i} text-3xl mb-2 group-hover:scale-110 transition-transform`}></i>
                         <span className="font-bold text-xs uppercase tracking-wide">{btn.j}</span>
                      </button>
                   ))}
                </div>
             </div>
          );
        }

        function FiturFormulir({ tipe, user, onSubmit }) {
           const [form, setForm] = useState({ jenis: 'Cuti', tanggal: '', alasan: '', konten: '' });
           
           const kirim = (e) => {
              e.preventDefault();
              if (tipe === 'pengajuan') onSubmit({ userName: user.name || user.nama, type: form.jenis, reason: form.alasan, date: form.tanggal, status: 'Menunggu' });
              else onSubmit({ userName: user.name || user.nama, date: new Date().toLocaleDateString('id-ID'), time: new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }), content: form.konten });
              setForm({ jenis: 'Cuti', tanggal: '', alasan: '', konten: '' });
           };

           return (
              <div className="space-y-4">
                 <h2 className="font-black text-slate-800 text-lg border-b-2 border-slate-100 pb-2 flex items-center">
                    {tipe === 'pengajuan' ? 'Form Izin & Cuti' : 'Laporan Pekerjaan'}
                 </h2>
                 <form onSubmit={kirim} className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                    {tipe === 'pengajuan' ? (
                       <>
                          <div>
                             <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Pilih Jenis</label>
                             <select value={form.jenis} onChange={(e)=>setForm({...form, jenis: e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-3 bg-slate-50 font-bold text-slate-700 outline-none focus:border-emerald-500 transition-all">
                                <option>Cuti</option><option>Izin</option><option>Sakit</option>
                             </select>
                          </div>
                          <div>
                             <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Tanggal</label>
                             <input type="date" required value={form.tanggal} onChange={(e)=>setForm({...form, tanggal: e.target.value})} className="w-full border-2 border-slate-100 rounded-xl p-3 bg-slate-50 font-bold text-slate-700 outline-none focus:border-emerald-500 transition-all" />
                          </div>
                          <div>
                             <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Detail Alasan</label>
                             <textarea required value={form.alasan} onChange={(e)=>setForm({...form, alasan: e.target.value})} rows="3" className="w-full border-2 border-slate-100 rounded-xl p-3 bg-slate-50 font-medium text-slate-700 outline-none focus:border-emerald-500 transition-all"></textarea>
                          </div>
                       </>
                    ) : (
                       <div>
                          <label className="block text-[10px] font-black text-slate-400 uppercase mb-2">Tuliskan Aktivitas Hari Ini</label>
                          <textarea required value={form.konten} onChange={(e)=>setForm({...form, konten: e.target.value})} rows="8" placeholder="- Evaluasi proyek...&#10;- Melayani klien..." className="w-full border-2 border-slate-100 rounded-xl p-4 bg-slate-50 font-medium text-slate-700 outline-none focus:border-emerald-500 leading-relaxed transition-all"></textarea>
                       </div>
                    )}
                    <button type="submit" className="w-full bg-slate-800 hover:bg-emerald-600 text-white font-black tracking-wide py-4 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center">
                       <i className="fas fa-paper-plane mr-2"></i> KIRIM SEKARANG
                    </button>
                 </form>
              </div>
           );
        }

        // --- 5. KOMPONEN: DASHBOARD ADMIN ---
        function DashboardAdmin({ onLogout, data, lokasiKantor, scriptUrl, aksi, exportCSV, isSinkron, forceRefresh }) {
          const [tabAktif, setTabAktif] = useState('pantau');
          const [modalLokasi, setModalLokasi] = useState(false);
          
          const [formPengaturan, setFormPengaturan] = useState({
              lat: lokasiKantor.lat,
              lng: lokasiKantor.lng,
              api_url: scriptUrl
          });

          const MenuSidebar = [
             { id: 'pantau', ikon: 'fa-satellite-dish', judul: 'Monitor Live' },
             { id: 'izin', ikon: 'fa-clipboard-check', judul: 'Approval Izin' },
             { id: 'tugas', ikon: 'fa-tasks', judul: 'Arsip Laporan' }
          ];

          return (
             <div className="flex h-screen bg-slate-50 font-sans">
                {/* Panel Kiri Desktop */}
                <div className="w-64 bg-slate-900 text-white hidden md:flex flex-col shadow-2xl z-20">
                   <div className="p-6 border-b border-slate-800 flex items-center">
                      <div className="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center mr-3 shadow-lg shadow-emerald-500/50"><i className="fas fa-file-excel text-xl"></i></div>
                      <div><h1 className="font-black text-lg leading-tight">AdminHub</h1><p className="text-[9px] font-bold text-emerald-400 uppercase tracking-widest mt-0.5"><i className="fas fa-wifi mr-1"></i>Server Panel</p></div>
                   </div>
                   <div className="flex-1 py-6 px-4 space-y-2">
                      {MenuSidebar.map(menu => (
                         <button key={menu.id} onClick={()=>setTabAktif(menu.id)} className={`w-full flex items-center px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${tabAktif === menu.id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className={`fas ${menu.ikon} w-6 text-left text-lg`}></i> {menu.judul}
                         </button>
                      ))}
                      <div className="pt-8">
                         <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest px-4 mb-2">Konfigurasi Sistem</p>
                         <button onClick={()=>setModalLokasi(true)} className="w-full flex items-center px-4 py-2.5 rounded-xl text-sm font-bold text-slate-400 hover:bg-slate-800 hover:text-white transition-all"><i className="fas fa-cog w-6 text-left"></i> Pengaturan Pusat</button>
                         <button onClick={()=>{ if(window.confirm('Yakin hapus SEMUA riwayat absen?')) aksi.resetAbsen(); }} className="w-full flex items-center px-4 py-2.5 rounded-xl text-sm font-bold text-rose-400 hover:bg-rose-500/10 transition-all mt-1"><i className="fas fa-trash-alt w-6 text-left"></i> Kosongkan Log</button>
                      </div>
                   </div>
                   <div className="p-4"><button onClick={onLogout} className="w-full py-3 bg-slate-800 text-slate-300 font-bold rounded-xl hover:bg-rose-600 hover:text-white transition-all flex items-center justify-center"><i className="fas fa-power-off mr-2"></i> KELUAR</button></div>
                </div>

                {/* Panel Utama */}
                <div className="flex-1 flex flex-col overflow-hidden relative">
                   {/* Navigasi Mobile */}
                   <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg z-20">
                      <h1 className="font-black flex items-center"><i className="fas fa-file-excel text-emerald-400 mr-2 text-xl"></i>AdminHub</h1>
                      <button onClick={onLogout} className="w-8 h-8 rounded-full bg-slate-800 text-rose-400 flex items-center justify-center"><i className="fas fa-power-off"></i></button>
                   </div>
                   <div className="md:hidden bg-white border-b border-slate-200 p-3 flex gap-2 overflow-x-auto shadow-sm z-10">
                      {MenuSidebar.map(m => <button key={m.id} onClick={()=>setTabAktif(m.id)} className={`whitespace-nowrap px-4 py-2.5 rounded-full text-xs font-bold transition-colors ${tabAktif === m.id ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}`}>{m.judul}</button>)}
                      <button onClick={()=>setModalLokasi(true)} className="bg-slate-100 text-slate-500 px-4 py-2.5 rounded-full text-xs font-bold"><i className="fas fa-cog"></i></button>
                   </div>

                   <main className="flex-1 overflow-y-auto p-4 md:p-8 relative bg-slate-50/50">
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 md:mb-8 gap-4">
                         <div>
                            <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">{MenuSidebar.find(i=>i.id===tabAktif)?.judul || 'Panel Administrator'}</h2>
                            <div className="flex items-center mt-1">
                                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center mr-3"><i className="fas fa-table text-emerald-500 mr-2"></i>Database Aktif</p>
                                {isSinkron && <span className="text-[10px] font-bold text-emerald-500 bg-emerald-50 px-2 py-0.5 rounded-full flex items-center"><i className="fas fa-sync fa-spin mr-1"></i> Sinkronisasi...</span>}
                            </div>
                         </div>
                         <div className="w-full md:w-auto flex gap-2">
                             <button onClick={forceRefresh} className="bg-white border border-slate-200 text-slate-600 px-4 py-3 rounded-xl font-bold text-sm shadow-sm hover:bg-slate-50 transition-colors flex items-center justify-center"><i className={`fas fa-sync-alt ${isSinkron?'fa-spin text-emerald-500':''}`}></i></button>
                             <button onClick={()=>exportCSV(data.logs, 'Rekap_Absen.csv')} className="flex-1 md:flex-none bg-emerald-600 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-md hover:bg-emerald-700 transition-colors flex items-center justify-center"><i className="fas fa-file-excel mr-2 text-lg"></i> Unduh CSV</button>
                         </div>
                      </div>

                      {/* Tampilan Tabel Monitor */}
                      {tabAktif === 'pantau' && (
                         <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="overflow-x-auto">
                               <table className="w-full text-left border-collapse whitespace-nowrap">
                                  <thead>
                                     <tr className="bg-slate-50 text-slate-500 border-b border-slate-100 text-[10px] uppercase font-black tracking-widest">
                                        <th className="p-5 pl-6">Profil Karyawan</th><th className="p-5">Waktu</th><th className="p-5">Kategori</th><th className="p-5">Sistem Validasi</th><th className="p-5 pr-6 text-right">Foto Bukti</th>
                                     </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-50">
                                     {data.logs.length === 0 ? <tr><td colSpan="5" className="p-12 text-center text-slate-400 font-bold"><i className="fas fa-folder-open text-4xl mb-3 block opacity-20"></i>Belum ada data masuk.</td></tr> : 
                                     data.logs.map((lg, idx) => (
                                        <tr key={lg.id || idx} className="hover:bg-slate-50/50 transition-colors">
                                           <td className="p-5 pl-6 font-black text-slate-800 text-sm">{lg.userName}</td>
                                           <td className="p-5 text-xs font-bold text-slate-500"><i className="far fa-calendar-alt mr-1"></i> {lg.date} <span className="mx-1 text-slate-300">|</span> <i className="far fa-clock mr-1"></i> {lg.time}</td>
                                           <td className="p-5"><span className={`px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider ${lg.type && lg.type.includes('Masuk') ? 'bg-emerald-100 text-emerald-700' : lg.type && lg.type.includes('Pulang') ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>{lg.type}</span></td>
                                           <td className="p-5"><span className={`text-xs font-black flex items-center ${lg.status==='Tepat Lokasi'?'text-emerald-500':lg.status==='GPS Tidak Aktif'?'text-amber-500':'text-rose-500'}`}><i className={`fas ${lg.status==='Tepat Lokasi'?'fa-check-circle':lg.status==='GPS Tidak Aktif'?'fa-exclamation-triangle':'fa-times-circle'} mr-1.5`}></i>{lg.status}</span></td>
                                           <td className="p-5 pr-6 flex justify-end">
                                             {lg.foto ? (
                                             <div className="w-10 h-10 rounded-xl overflow-hidden border-2 border-slate-100 shadow-sm bg-slate-50 hover:scale-[2] hover:-translate-x-4 transition-transform origin-right cursor-zoom-in">
                                               <img src={lg.foto} alt="Bukti" className="w-full h-full object-cover" />
                                             </div>
                                             ) : <span className="text-xs text-slate-400 font-bold">No Image</span>}
                                           </td>
                                        </tr>
                                     ))}
                                  </tbody>
                               </table>
                            </div>
                         </div>
                      )}

                      {/* Tampilan Kartu Izin */}
                      {tabAktif === 'izin' && (
                         <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                            {data.pengajuan.length === 0 ? <div className="col-span-full text-center p-12 text-slate-400 font-bold"><i className="fas fa-inbox text-4xl mb-3 block opacity-20"></i>Tidak ada antrean persetujuan.</div> : 
                            data.pengajuan.map((req, idx) => (
                               <div key={req.id || idx} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
                                  <div>
                                     <div className="flex justify-between items-center mb-4">
                                        <div className="font-black text-slate-800 text-lg line-clamp-1">{req.userName}</div>
                                        <span className={`px-3 py-1 text-[10px] font-black uppercase tracking-wider rounded-lg ${req.status==='Menunggu'?'bg-amber-100 text-amber-700':req.status==='Disetujui'?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700'}`}>{req.status}</span>
                                     </div>
                                     <div className="bg-slate-50 p-4 rounded-2xl mb-5 border border-slate-100">
                                        <div className="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1"><i className="fas fa-tag mr-1"></i> {req.type} &bull; {req.date}</div>
                                        <p className="text-sm font-medium text-slate-600 mt-2 leading-relaxed">"{req.reason}"</p>
                                     </div>
                                  </div>
                                  {req.status === 'Menunggu' && (
                                     <div className="flex gap-3">
                                        <button onClick={()=>aksi.updateStatus(req.id, 'Ditolak')} className="flex-1 py-3 border-2 border-slate-100 rounded-xl text-xs font-black text-slate-500 hover:border-rose-200 hover:text-rose-600 hover:bg-rose-50 transition-all">TOLAK</button>
                                        <button onClick={()=>aksi.updateStatus(req.id, 'Disetujui')} className="flex-1 py-3 bg-slate-900 rounded-xl text-xs font-black text-white hover:bg-emerald-600 shadow-lg transition-all">SETUJUI</button>
                                     </div>
                                  )}
                               </div>
                            ))}
                         </div>
                      )}

                      {/* Tampilan Laporan */}
                      {tabAktif === 'tugas' && (
                         <div className="columns-1 md:columns-2 lg:columns-3 gap-5 space-y-5">
                            {data.laporan.length === 0 ? <div className="col-span-full p-12 text-center text-slate-400 font-bold"><i className="fas fa-clipboard-list text-4xl mb-3 block opacity-20"></i>Arsip laporan kosong.</div> : 
                            data.laporan.map((rep, idx) => (
                               <div key={rep.id || idx} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm break-inside-avoid hover:shadow-md transition-shadow">
                                  <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                                     <span className="font-black text-slate-800">{rep.userName}</span>
                                     <span className="text-[10px] font-bold text-slate-500 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-100"><i className="far fa-clock mr-1"></i> {rep.date}</span>
                                  </div>
                                  <p className="text-sm font-medium text-slate-600 whitespace-pre-line leading-relaxed">{rep.content}</p>
                               </div>
                            ))}
                         </div>
                      )}
                   </main>

                   {/* Komponen Modal Pengaturan */}
                   {modalLokasi && (
                      <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                         <div className="bg-white w-full max-w-md rounded-[2rem] overflow-hidden shadow-2xl scale-100 animate-in zoom-in-95">
                            <div className="bg-slate-900 p-6 flex justify-between items-center text-white">
                               <h3 className="font-black"><i className="fas fa-cog text-emerald-400 mr-2"></i> Pengaturan Sistem</h3>
                               <button onClick={()=>setModalLokasi(false)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors"><i className="fas fa-times"></i></button>
                            </div>
                            <div className="p-8 h-96 overflow-y-auto">
                               
                               {/* Bagian API URL */}
                               <div className="mb-6 pb-6 border-b border-slate-100">
                                   <h4 className="text-sm font-black text-slate-800 mb-2"><i className="fas fa-link text-emerald-500 mr-2"></i>Koneksi Google Sheets</h4>
                                   <p className="text-[10px] font-medium text-slate-500 mb-3 leading-relaxed">Masukkan "URL Aplikasi Web" dari Google Apps Script Anda. Pastikan akses diatur ke "Anyone" (Siapa saja).</p>
                                   <input type="text" placeholder="https://script.google.com/..." value={formPengaturan.api_url} onChange={(e)=>setFormPengaturan({...formPengaturan, api_url: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl bg-slate-50 p-4 text-xs outline-none focus:border-emerald-500 font-mono text-slate-700 transition-colors" />
                               </div>

                               {/* Bagian Koordinat */}
                               <div>
                                   <h4 className="text-sm font-black text-slate-800 mb-2"><i className="fas fa-map-marker-alt text-emerald-500 mr-2"></i>Pusat GPS Kantor</h4>
                                   <p className="text-[10px] font-medium text-slate-500 mb-3 leading-relaxed">Sistem di HP karyawan akan mengukur jarak (maks. 100m) dari titik ini.</p>
                                   <div className="space-y-4">
                                      <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Garis Lintang (Latitude)</label><input type="number" step="any" value={formPengaturan.lat} onChange={(e)=>setFormPengaturan({...formPengaturan, lat: parseFloat(e.target.value)})} className="w-full border-2 border-slate-100 rounded-xl bg-slate-50 p-4 outline-none focus:border-emerald-500 font-bold text-slate-700 transition-colors" /></div>
                                      <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Garis Bujur (Longitude)</label><input type="number" step="any" value={formPengaturan.lng} onChange={(e)=>setFormPengaturan({...formPengaturan, lng: parseFloat(e.target.value)})} className="w-full border-2 border-slate-100 rounded-xl bg-slate-50 p-4 outline-none focus:border-emerald-500 font-bold text-slate-700 transition-colors" /></div>
                                   </div>
                               </div>

                               <button onClick={()=>{ 
                                   aksi.updatePengaturan({ lat: formPengaturan.lat, lng: formPengaturan.lng }, formPengaturan.api_url); 
                                   setModalLokasi(false); 
                               }} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-lg mt-8 transition-all active:scale-95">SIMPAN PENGATURAN</button>
                            </div>
                         </div>
                      </div>
                   )}
                </div>
             </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AplikasiAbsensi />);
    </script>
</body>
</html>
